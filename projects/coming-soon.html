<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon - Che CHENG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #2563eb;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --bg-main: #ffffff;
      --bg-light: #f9fafb;
      --border: #e5e7eb;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--text-primary);
      background-color: var(--bg-light);
      line-height: 1.7;
    }
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(255, 255, 255, 0.98);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      display: flex;
      align-items: center;
      box-shadow: var(--shadow);
    }
    .navbar-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .navbar-brand {
      color: var(--primary);
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .nav-back {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.95rem;
    }
    .nav-back:hover { color: var(--primary); }
    main {
      margin-top: 70px;
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
      padding: 3rem 1.5rem;
    }
    .panel {
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.8rem;
      color: var(--text-primary);
    }
    p {
      color: var(--text-secondary);
      margin-bottom: 1.2rem;
    }
    .status {
      display: inline-block;
      padding: 0.32rem 0.72rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      background: #eff6ff;
      color: #1e40af;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-container">
      <a href="/" class="navbar-brand">Che CHENG</a>
      <a href="/" class="nav-back">← Back to Homepage</a>
    </div>
  </nav>

  <main>
    <section class="panel">
      <h1>Coming Soon</h1>
      <p>Detailed project page is currently under preparation.</p>
      <span class="status">In Progress</span>
    </section>
  </main>
</body>
</html>
